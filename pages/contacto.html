  <main>
    <article>
      <h2>Formulario de contacto</h2>
      <form action="">
        <fieldset>
          <legend>Datos principales:</legend>
          <p>
            <label for="correo">Tu correo electrónico:</label>
            <input type="email" name="correo" id="correo" autofocus tabindex="1">
          </p>
          <p>
            <label for="mensaje">Mensaje:</label><br>
            <textarea name="mensaje" id="mensaje" cols="38" rows="10" placeholder="Escribe los que desees contarnos."
              tabindex="2"></textarea>
          </p>
          <p>
            <button type="submit">Contactar</button><button type="reset">Borrar todo</button>
          </p>
        </fieldset>
      </form>
    </article>
  </main>
</body>
